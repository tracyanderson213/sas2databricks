# HLS SAS DBX Migration — Pipeline Configuration
# Spark Declarative Pipeline replacing SAS batch processing

name: hls_sas_dbx_claims_pipeline
target: na-dbxtraining.hls_sas_dbx_claims
storage_location: /Volumes/na-dbxtraining/hls_sas_dbx_claims/pipeline_storage

configuration:
  # SAS business rule constants (from migrated macros)
  baseline_weekly_claims: "2500000"
  spike_threshold_ratio: "1.25"
  affected_batch_id: "AC-2026-Q1"

clusters:
  - label: default
    autoscale:
      min_workers: 1
      max_workers: 5
      mode: ENHANCED

libraries:
  - notebook:
      path: /Workspace/Repos/.../pipeline/claims_pipeline.py

channel: CURRENT

development: true

continuous: false

edition: ADVANCED

photon: true

serverless: true

notifications:
  - id: on_failure
    email_recipients:
      - sarah.chen@hls-sas-dbx.com
    alerts:
      - on-update-failure
      - on-update-fatal-failure
      - on-flow-failure
