resources:
  pipelines:
    sas2dbx_migrate_pipeline:
      name: sas2dbx_migrate_pipeline_${bundle.target}

      catalog: ${var.catalog}
      target: ${var.schema}

      development: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      photon: true
      serverless: true

      configuration:
        baseline_weekly_claims: "2500000"
        spike_threshold_ratio: "1.25"
        affected_batch_id: "AC-2026-Q1"
        source_catalog: ${var.catalog}
        source_schema: ${var.source_schema}

      libraries:
        - notebook:
            path: ../src/claims_pipeline.py

      # Note: Cluster settings removed - using serverless compute

      notifications:
        - email_recipients:
            - tracy.anderson@3cloudsolutions.com
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure

  # Note: Metric views can be created manually after pipeline runs
