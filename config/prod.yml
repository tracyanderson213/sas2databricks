      developer_id: "prod"
      schema_prefix: "sas"
      warehouse_id: "2f51df324d05e45d"

    workspace:
      host: "https://adb-1952652121322753.13.azuredatabricks.net"
      # Service principal workspace path (from Training Accelerator)
      root_path: "/Workspace/Users/57755c23-5f4c-45ac-b2a2-118523d0c1b5/.bundle/${bundle.name}/prod"

    # Production safety: require explicit approval
